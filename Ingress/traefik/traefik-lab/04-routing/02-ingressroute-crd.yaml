# IngressRoute: CRD nativo do Traefik — mais expressivo que Ingress
# Permite matchers ricos (Host, PathPrefix, Headers, Query, etc), middlewares
# e suporte direto a TCP/UDP routes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-route
  namespace: lab-apps
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`whoami.kubenerd.local`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: whoami
          port: 80
      middlewares:
        - name: strip-api-prefix
    - match: Host(`whoami.kubenerd.local`)
      kind: Rule
      services:
        - name: whoami
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: lab-apps
spec:
  stripPrefix:
    prefixes:
      - /api
