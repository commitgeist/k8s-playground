apiVersion: apps/v1
kind: Deployment
metadata:
  name: techday-weproc
  namespace: lab-apps
  labels: { app: techday-weproc }
spec:
  replicas: 1
  selector:
    matchLabels: { app: techday-weproc }
  template:
    metadata:
      labels: { app: techday-weproc }
    spec:
      containers:
        - name: techday-weproc
          image: viniciuspoa2/techday_weproc:main
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: techday-weproc-service
  namespace: lab-apps
spec:
  selector: { app: techday-weproc }
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traeifk-site-app
  namespace: lab-apps
spec:
  ingressClassName: traefik
  rules:
    - host: techday-weproc.kubenerd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: techday-weproc-service
                port:
                  number: 80
