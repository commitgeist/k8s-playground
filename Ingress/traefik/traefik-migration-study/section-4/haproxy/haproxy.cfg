global
    log /dev/log    daemon
    maxconn 256

defaults
    log global
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# --- HTTP (Port 80) Entrypoint ---
frontend http-in
    bind *:80
    mode tcp
    default_backend traefik-web

backend traefik-web
    mode tcp
    balance roundrobin # Load balancing across worker nodes
    # Replace <NODE_1_IP> and <NODE_2_IP> with your actual Kubernetes Node IPs
    server node1 <NODE_1_IP>:30080 check
    server node2 <NODE_2_IP>:30080 check

# --- HTTPS (Port 443) Entrypoint ---
frontend https-in
    bind *:443
    mode tcp
    default_backend traefik-websecure

backend traefik-websecure
    mode tcp
    balance roundrobin
    # Replace <NODE_1_IP> and <NODE_2_IP> with your actual Kubernetes Node IPs
    server node1 <NODE_1_IP>:30443 check
    server node2 <NODE_2_IP>:30443 check