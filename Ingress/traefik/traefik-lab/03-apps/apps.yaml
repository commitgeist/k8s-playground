apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: lab-apps
  labels: { app: whoami }
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: lab-apps
spec:
  selector: { app: whoami }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hello
  namespace: lab-apps
  labels: { app: nginx-hello }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nginx-hello }
  template:
    metadata:
      labels: { app: nginx-hello }
    spec:
      containers:
        - name: nginx
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-hello
  namespace: lab-apps
spec:
  selector: { app: nginx-hello }
  ports:
    - port: 80
      targetPort: 80
