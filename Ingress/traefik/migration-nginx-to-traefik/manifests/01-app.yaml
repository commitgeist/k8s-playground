apiVersion: v1
kind: Namespace
metadata:
  name: migration-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: migration-lab
  labels: { app: app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: migration-lab
spec:
  selector: { app: app }
  ports:
    - port: 80
      targetPort: 80
