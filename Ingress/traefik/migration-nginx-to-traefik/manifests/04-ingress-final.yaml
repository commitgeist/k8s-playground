# Estado final: um unico Ingress, ingressClassName trocado pra traefik.
# Esse e o "estado limpo" pos-migracao.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: migration-lab
spec:
  ingressClassName: traefik
  rules:
    - host: app.kubenerd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
