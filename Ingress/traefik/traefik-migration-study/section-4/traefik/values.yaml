# values.yaml
deployment:
  kind: DaemonSet
hostNetworking:
  enabled: true

service:
  type: NodePort # This ensures the Service type is NodePort
ports:
  web:
    nodePort: 30080 # Set NodePort for HTTP (80)
  websecure:
    nodePort: 30443 # Set NodePort for HTTPS (443)
    tls:
      enabled: true

api:
  # -- Enable the dashboard
  dashboard: true
  # -- Configure API basePath
  basePath: ""  # @schema type:[string, null]; default: "/"


ingressRoute:
  dashboard:
    enabled: true
    # Custom match rule with host domain
    matchRule: Host(`traefik.rancher.devopsforlife.io`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
    # entryPoints: ["web"]
    entryPoints: ["websecure"]
    # Add custom middlewares : authentication and redirection
    middlewares:
      - name: traefik-dashboard-auth
    tls:
      secretName: traefik-dashboard-cert


# Create the custom middlewares used by the IngressRoute dashboard (can also be created in another way).
# /!\ Yes, you need to replace "changeme" password with a better one. /!\
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: traefik-dashboard-auth-secret
    type: kubernetes.io/basic-auth
    stringData:
      username: admin
      password: 12qwaszx

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-auth
    spec:
      basicAuth:
        secret: traefik-dashboard-auth-secret