apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-app
  template:
    metadata:
      labels:
        app: site-app
    spec:
      containers:
      - name: site-nginx
        image: higorluisbarbosa/site-treinamentos:v3
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: site-app-service
  labels:
    app: site-app
spec:
  type: ClusterIP
  selector:
    app: site-app
  ports:
  - port: 80
    targetPort: 80
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traeifk-site-app
  namespace: lab-apps
spec:
  ingressClassName: traefik
  rules:
    - host: site-app.kubenerd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site-app-service
                port:
                  number: 80
