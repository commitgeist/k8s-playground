apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-python-app-ingress
  namespace: default
  # Add annotation for forcing HTTP -> HTTPS redirect (Best Practice)
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true" 
spec:
  # Specify the Ingress Controller to handle this (Required/Recommended)
  ingressClassName: nginx 
  tls:
  - hosts:
    - python.rancher.devopsforlife.io  
    secretName: python-tls-secret
  rules:
  - host: python.rancher.devopsforlife.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simple-python-app-service
            port:
              number: 80